# 改 prefix 为 Ctrl+a（比默认的 Ctrl+b 更顺手）
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 鼠标支持（可点击切换pane/调整大小）
set -g mouse on

# 从1开始编号（键盘布局更合理）
set -g base-index 1

# 增大历史记录
set -g history-limit 50000

# 分屏：v = 垂直分屏（左右），- = 水平分屏（上下），均继承当前路径
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# vim 风格在 pane 间移动
bind k select-pane -U
bind j select-pane -D
bind l select-pane -R
bind h select-pane -L

# 状态栏显示优化
set -g status-right '#{?window_zoomed_flag,🔍,} #[fg=yellow]%H:%M #[fg=cyan]%d-%b'

# 颜色支持（跑深度学习日志很有用）
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# ─── Plugins (TPM) ────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect: 保存 pane 内容 + 指定要恢复的程序
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'vim nvim tail less man top htop'

# continuum: 自动保存 + 启动时自动恢复
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# 必须在文件最末尾
run '~/.tmux/plugins/tpm/tpm'
